<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class=" bg-gray-900 text-white">

    <header class="sticky top-0 z-50 backdrop-blur-lg" >
        <nav class="bg-white border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <a href="#" class="text-2xl font-bold text-blue-600">📝NewsExplorer</a>

                <div class=" hidden md:flex items-center gap-6">
                    <a href="#" id="homeLink" class="text-lg text-gray-700 hover:text-blue-600 duration-200">Home</a>
                    <a href="#" id="technologyLink" class="text-lg text-gray-700 hover:text-blue-600 duration-200">Technology</a>
                    <a href="#" id="businessLink" class="text-lg text-gray-700 hover:text-blue-600 duration-200">Business</a>
                    <a href="#"  id="sportsLink" class="text-lg text-gray-700 hover:text-blue-600 duration-200">Sports</a>
                </div>
                <button id="menuBtn" class="md:hidden text-gray-700 hover:text-blue-600">
                    <svg id="menuIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>

             <div id="mobileMenu" class=" hidden md:hidden bg-white border-t border-gray-200 px-6 py-4 flex flex-col gap-4 ">
                    <a href="#" class="text-lg text-gray-700 hover:text-blue-600 duration-200">Home</a>
                    <a href="#" class="text-lg text-gray-700 hover:text-blue-600 duration-200">Technology</a>
                    <a href="#" class="text-lg text-gray-700 hover:text-blue-600 duration-200">Business</a>
                    <a href="#" class="text-lg text-gray-700 hover:text-blue-600 duration-200">Sports</a>
                </div>
        </nav>
    </header>

    <main>
        <section class="bg-blue-600 text-white">
            <div class="max-w-7xl mx-auto px-6 py-16 text-center">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">Discover What's Happening</h1>
                <p class="text-lg text-blue-100 mb-8 max-w-2xl mx-auto">Stay updated with the latest news from around the world.</p>
           
                <div class="max-w-2xl mx-auto flex flex-col sm:flex-row gap-3">
                    <input type="text" id="searchInput" placeholder="Search for news..." 
                    class="flex-1 px-5 py-3 rounded-lg text-gray-900 outline-none focus:ring-4 focus:ring-blue-300">
                    <button id="searchBtn" class="px-6 py-3 bg-gray-900 text-white font-semibold rounded-lg hover:bg-gray-800 transition duration-200">🔍Search</button>
                </div>
            </div>

        </section>

        <section class="max-w-7xl mx-auto px-6 py-8">
            <div class="flex flex-wrap items-center justify-center gap-3">
                <button class="px-5 py-2 rounded-full bg-blue-600 text-white font-medium">All</button>
                <button class="px-5 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-blue-100 hover:text-blue-600 transition">Technology</button>
                <button class="px-5 py-2 rounded-full bg-gray-200 text-gray-800 hover:bg-blue-100 hover:text-blue-600 transition">Business</button>
                <button class="px-5 py-2 rounded-full bg-gray-200 text-gray-800 hover:bg-blue-100 hover:text-blue-600 transition">Sports</button>
                <button class="px-5 py-2 rounded-full bg-gray-200 text-gray-800 hover:bg-blue-100 hover:text-blue-600 transition">Entertainment</button>
                <button class="px-5 py-2 rounded-full bg-gray-200 text-gray-800 hover:bg-blue-100 hover:text-blue-600 transition">Science</button>
                <button class="px-5 py-2 rounded-full bg-gray-200 text-gray-800 hover:bg-blue-100 hover:text-blue-600 transition">Health</button>
            </div>

        </section>


  <section class="max-w-7xl mx-auto px-6 py-8 text-center">

    <div class="mb-8">
        <h2 class="text-3xl font-bold">
            Latest News
        </h2>

        <p class="text-gray-400 mt-2">
            Stay updated with the latest stories.
        </p>
    </div>

    
    <div id="newsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        

    </div>
    <div class="text-center mt-8">
    <button
        id="loadMoreBtn"
        class="px-6 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition"
    >
        Load More
    </button>
</div>

</section>
    </main>



   
<footer class="bg-gray-950 text-white mt-16">

    <div class="max-w-7xl mx-auto px-6 py-8">

        <div class="flex flex-col md:flex-row items-center justify-between gap-5">

          
            <div class="text-center md:text-left">

                <h2 class="text-xl font-bold">
                    News<span class="text-blue-500">Explorer</span>
                </h2>

                <p class="text-gray-500 text-sm mt-1">
                    © 2026 📝NewsExplorer. All rights reserved.
                </p>

            </div>


    
            <div class="flex items-center gap-3">

                <a
                    href="https://www.linkedin.com/in/taimur-khan123/"
                    target="_blank"
                    class="px-4 py-2 rounded-lg bg-gray-800
                           text-gray-300 hover:bg-blue-600
                           hover:text-white transition"
                >
                    LinkedIn
                </a>


              
                <a
                    href="https://github.com/taimurkhan123"
                    target="_blank"
                    class="px-4 py-2 rounded-lg bg-gray-800
                           text-gray-300 hover:bg-gray-700
                           hover:text-white transition"
                >
                    GitHub
                </a>

            </div>

        </div>

    </div>

</footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
